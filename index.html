<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toyota Connected Multimedia OS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      * {
        font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.015em;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace !important;
      }
      html, body, #root {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #080B11;
      }
      .map-bounded-frame {
        border-radius: 24px;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      }
      .leaflet-container {
        width: 100% !important;
        height: 100% !important;
        background: #080B11 !important;
      }
      /* Clean High-Contrast Dark Glass (No Muddy Over-Blur) */
      .crisp-glass {
        background: rgba(14, 19, 28, 0.88) !important;
        border: 1px solid rgba(255, 255, 255, 0.12) !important;
        border-top: 1px solid rgba(255, 255, 255, 0.22) !important;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55) !important;
      }
      .spring-touch-btn {
        transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.15s ease;
      }
      .spring-touch-btn:hover {
        transform: scale(1.03);
      }
      .spring-touch-btn:active {
        transform: scale(0.96);
      }
      @keyframes vinyl-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .vinyl-spinning {
        animation: vinyl-spin 12s linear infinite;
      }
    </style>
  </head>
  <body class="bg-[#080B11] text-white select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
